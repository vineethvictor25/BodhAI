name: ETL reference checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          PROVIDER: local
          EMAIL_ENABLED: 'false'
      - run: node --check static/app.js
      - run: node --check static/medallion.js
      - run: node --check static/destinations.js
      - run: node --check static/privacy.js
