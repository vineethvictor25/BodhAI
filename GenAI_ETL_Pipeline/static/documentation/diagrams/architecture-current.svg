ight="87" rx="2" fill="#127c73"/><text x="800" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Privacy + review controls</text><text x="800" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Column AES-GCM / mask / HMAC</text><text x="800" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Protected replay / withheld AI samples</text><text x="800" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Step-up decrypt / version approvals</text><rect x="1140" y="530" width="300" height="115" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="1141" y="544" width="4" height="87" rx="2" fill="#127c73"/><text x="1160" y="559" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Notification worker · optional</text><text x="1160" y="585" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Claims durable outbox events</text><text x="1160" y="606" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">STARTTLS / SSL, bounded retries</text><text x="1160" y="627" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Metadata-only mail; at-least-once</text><path d="M210 530 V490 H570 V450" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/><text x="275" y="483" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#127c73" font-weight="400">Optional reviewed context</text><path d="M930 530 V450" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="946" y="497" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#127c73" font-weight="400">Review boundary</text><path d="M210 645 V700" fill="none" stroke="#7e98a2" str