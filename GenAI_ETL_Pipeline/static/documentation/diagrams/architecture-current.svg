"800" y="349" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Change review + versions</text><text x="800" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Conversation → diff → pure preview</text><text x="800" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Human approval → activate version</text><text x="800" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Run and rollback are separate</text><rect x="1140" y="320" width="300" height="130" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="1141" y="334" width="4" height="102" rx="2" fill="#127c73"/><text x="1160" y="349" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Deterministic ETL + DQ</text><text x="1160" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Streamed transforms in row batches</text><text x="1160" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Silver / quarantine / Gold and DQ</text><text x="1160" y="417" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Atomic load modes / SCD2 history</text><path d="M420 382 H405 V242 H1290 V225" fill="none" stroke="#a66824" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#gold)"/><text x="770" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#a66824" font-weight="400">Optional external model calls; PII samples withheld</text><path d="M1080 383 H1140" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="1084" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#127c73" font-weight="400">preview / run</text><path d="M360 418 H390 V700" fill="none" stroke="#7e98a2" stroke-width