<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" role="img" aria-labelledby="title desc"><title id="title">FlowForge 1.5 | Implemented architecture</title><desc id="desc">Local reference implementation · one application process · reviewed proposals, deterministic execution</desc><rect width="1560" height="1180" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7e98a2"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#127c73"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a66824"/></marker></defs><text x="60" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#183039" font-weight="700">FlowForge 1.5 | Implemented architecture</text><text x="60" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5d747e" font-weight="400">Local reference implementation · one application process · reviewed proposals, deterministic execution</text><rect x="60" y="115" width="300" height="110" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="61" y="129" width="4" height="82" rx="2" fill="#127c73"/><text x="80" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Browser console + CLI</text><text x="80" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Sources, recipes and quality reports</text><text x="80" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Data model, joins and change review</text><rect x="420" y="115" width="630" height="110" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="421" y="129" width="4" height="82" rx="2" fill="#127c73"/><text x="440" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">FastAPI + validated request boundary</text><text x="440" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Data APIs: shared token or permitted loopback access</text><text x="440" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Long operations offloaded to threads; no durable ETL queue</text><rect x="1140" y="115" width="300" height="110" rx="12" fill="#fff7ec" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1141" y="129" width="4" height="82" rx="2" fill="#a66824"/><text x="1160" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">LLM routes · optional</text><text x="1160" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">OpenAI / Gemini / Groq / DeepSeek</text><text x="1160" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Bounded retries and typed responses</text><path d="M360 170 H420" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="366" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#127c73" font-weight="400">HTTP</text><rect x="30" y="255" width="1500" height="735" rx="18" fill="#ffffff" stroke="#cbd9dd" stroke-dasharray="9 5"/><text x="60" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#127c73" font-weight="700">ONE FASTAPI PROCESS — modules share the local control store</text><path d="M735 225 V304" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round"/><path d="M210 304 H1290" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round"/><path d="M210 304 V320" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M570 304 V320" fill="none" stroke="#127c73" stroke-w