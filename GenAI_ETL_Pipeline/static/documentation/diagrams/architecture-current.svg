00">managed_pipelines · versions</text><text x="430" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">pipeline_changes · preview reports</text><text x="775" y="830" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#416a99" font-weight="650">Knowledge + evaluations</text><text x="775" y="855" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">kb_documents · chunks · FTS index</text><text x="775" y="878" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">corpus revision</text><text x="775" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">evaluation_runs</text><text x="1120" y="830" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#416a99" font-weight="650">Audit + email delivery</text><text x="1120" y="855" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">events</text><text x="1120" y="878" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">notification_outbox</text><text x="1120" y="901" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">Pending → sending → sent / retry</text><rect x="1140" y="1035" width="300" height="105" rx="12" fill="#fff7ec" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1141" y="1049" width="4" height="77" rx="2" fill="#a66824"/><text x="1160" y="1064" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Approved SMTP provider</text><text x="1160" y="1090" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Enabled only after configuration</text><text x="1160" y="1111" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">SMTP acceptance ≠ inbox delivery</text><path d="M1440 588 H1505 V1087 H1440" fill="none" stroke="#a66824" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#gold)"/><text x="102" y="1044" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#127c73" font-weight="700">CONTROL BOUNDARY</text><text x="102" y="1072" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#183039" font-weight="600">Model proposes. A person reviews. Server functions activate and execute.</text><text x="102" y="1102" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Preview never publishes. Rollback restores configuration, not existing warehouse rows.</text><text x="60" y="1160" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5d747e" font-weight="400">Solid: implemented local path     Dashed gold: optional external integration     No autonomous agent, vector DB or distributed ETL worker is running.</text></svg>