<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="815" viewBox="0 0 1560 815" role="img" aria-labelledby="title desc"><title id="title">FlowForge | Multi-source mapping and join review</title><desc id="desc">Implemented workflow · AI suggests field meanings and keys · local checks validate the proposal</desc><rect width="1560" height="815" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7e98a2"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#127c73"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a66824"/></marker></defs><text x="60" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#183039" font-weight="700">FlowForge | Multi-source mapping and join review</text><text x="60" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5d747e" font-weight="400">Implemented workflow · AI suggests field meanings and keys · local checks validate the proposal</text><rect x="60" y="115" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="61" y="129" width="4" height="97" rx="2" fill="#127c73"/><text x="80" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Selected source snapshots</text><text x="80" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Two to five for AI discovery</text><text x="80" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Files and staged API extracts</text><text x="80" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Optional business grain and aliases</text><rect x="420" y="115" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="421" y="129" width="4" height="97" rx="2" fill="#127c73"/><text x="440" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Build bounded profiles</text><text x="440" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Paths, types, counts and samples</text><text x="440" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Detected sensitive samples withheld</text><text x="440" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Optional reviewed reference context</text><rect x="780" y="115" width="300" height="125" rx="12" fill="#fff7ec" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="781" y="129" width="4" height="97" rx="2" fill="#a66824"/><text x="800" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Configured AI model</text><text x="800" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Equivalent fields and target schema</text><text x="800" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Candidate keys and append or join</text><text x="800" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">One correction within route budgets</text><rect x="1140" y="115" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="1141" y="129" width="4" height="97" rx="2" fill="#127c73"/><text x="1160" y="144" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Validate proposed bindings</text><text x="1160" y="170" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Only selected source paths</text><text x="1160" y="191" font-family="Segoe UI,Arial,sans-serif" 