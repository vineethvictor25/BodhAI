ctive source-to-target lineage</text><text x="800" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Confirm the relationship and grain</text><rect x="420" y="325" width="300" height="125" rx="12" fill="#fff7ec" stroke="#a66824" stroke-width="1.6"/><rect x="421" y="339" width="4" height="97" rx="2" fill="#a66824"/><text x="440" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Unresolved draft</text><text x="440" y="380" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Show equivalent fields and blockers</text><text x="440" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Review missing append sources</text><text x="440" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Revise intent or source selection</text><path d="M1290 240 V325" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M1140 388 H1080" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M780 388 H720" fill="none" stroke="#a66824" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#gold)"/><rect x="60" y="550" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="61" y="564" width="4" height="97" rx="2" fill="#127c73"/><text x="80" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Mapped append</text><text x="80" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Review each source binding</text><text x="80" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Normalize records to one contract</text><text x="80" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Combine during the reviewed run</text><rect x="420" y="550" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="421" y="564" width="4" height="97" rx="2" fill="#127c73"/><text x="440" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Reviewed join</text><text x="440" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Stage a new combined source</text><text x="440" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Preserve left/right parent lineage</text><text x="440" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Generate final combined mappings</text><rect x="780" y="550" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="781" y="564" width="4" height="97" rx="2" fill="#127c73"/><text x="800" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Approve exact mappings</text><text x="800" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Bind decisions to source snapshots</text><text x="800" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Resolve required target fields</text><text x="800" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Persist immutable approval</text><rect x="1140" y="550" width="300" height="125" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="1141" y="564" width="4" height="97" rx="2" fill="#127c73"/><text x="1160" y="579" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Run reviewed pipeline</text><text x="1160" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Apply transformations and DQ</text><text x="1160" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Write Silver, quarantine and Gold</text><text x="1160" y="647" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Publish through the target gate</text><path d="M930 450 V483 H210 V550" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="230" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#127c73" font-weight="400">Append</text><path d="M930 483 H570 V550" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="588" y="505" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#127c73" font-weight="400">Join</text><path d="M360 635 H390 V704 H930 V675" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M720 612 H780" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M1080 612 H1140" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><text x="60" y="751" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#183039" font-weight="650">A verified right lookup key supports a join. A verified target primary key identifies one row at the target grain.</text><text x="60" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">One join stage uses two snapshots. Disk space governs merge capacity. The separate transformation preview accepts 25,000 input rows.</text></svg>