<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1260" viewBox="0 0 1560 1260" role="img" aria-labelledby="title desc"><title id="title">FlowForge | Proposed cloud-native target</title><desc id="desc">NOT DEPLOYED · migration option after identity, durable storage, execution and operating requirements are agreed</desc><rect width="1560" height="1260" fill="#f6f8fa"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7e98a2"/></marker><marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#127c73"/></marker><marker id="gold" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a66824"/></marker></defs><text x="60" y="46" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#183039" font-weight="700">FlowForge | Proposed cloud-native target</text><text x="60" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#5d747e" font-weight="400">NOT DEPLOYED · migration option after identity, durable storage, execution and operating requirements are agreed</text><rect x="60" y="120" width="300" height="110" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="61" y="134" width="4" height="82" rx="2" fill="#127c73"/><text x="80" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Review console / API clients</text><text x="80" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Named users and explicit approvals</text><text x="80" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">No secrets in the browser</text><rect x="510" y="120" width="420" height="110" rx="12" fill="white" stroke="#127c73" stroke-width="1.6"/><rect x="511" y="134" width="4" height="82" rx="2" fill="#127c73"/><text x="530" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">TLS ingress + OIDC / role controls</text><text x="530" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Author, reviewer and operator permissions</text><text x="530" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Access scope enforced on data + retrieval</text><rect x="1140" y="120" width="300" height="110" rx="12" fill="#edf3fa" stroke="#416a99" stroke-width="1.6"/><rect x="1141" y="134" width="4" height="82" rx="2" fill="#416a99"/><text x="1160" y="149" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Managed security services</text><text x="1160" y="175" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Secrets / workload identity</text><text x="1160" y="196" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Network and egress policy</text><path d="M360 175 H510" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M930 175 H1140" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="30" y="280" width="1500" height="655" rx="18" fill="white" stroke="#9eafc0" stroke-dasharray="10 6"/><text x="60" y="310" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#416a99" font-weight="700">PROPOSED BASELINE — not the current application deployment</text><rect x="60" y="350" width="300" height="130" rx="12" fill="white" stroke="#416a99" stroke-width="1.6"/><rect x="61" y="364" width="4" height="102" rx="2" fill="#416a99"/><text x="80" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Stateless FastAPI replicas</text><text x="80" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Request validation + authorization</text><text x="80" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Submit jobs; return durable IDs</text><text x="80" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">No shared local SQLite files</text><rect x="420" y="350" width="300" height="130" rx="12" fill="white" stroke="#416a99" stroke-width="1.6"/><rect x="421" y="364" width="4" height="102" rx="2" fill="#416a99"/><text x="440" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Managed PostgreSQL</text><text x="440" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Run / mapping / version control data</text><text x="440" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Migrations, audit and outbox</text><text x="440" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Authoritative approval state</text><rect x="780" y="350" width="300" height="130" rx="12" fill="white" stroke="#416a99" stroke-width="1.6"/><rect x="781" y="364" width="4" height="102" rx="2" fill="#416a99"/><text x="800" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Durable job queue</text><text x="800" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Bounded retry / dead-letter policy</text><text x="800" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Leases, heartbeat and recovery</text><text x="800" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Idempotent consumer design</text><rect x="1140" y="350" width="300" height="130" rx="12" fill="white" stroke="#416a99" stroke-width="1.6"/><rect x="1141" y="364" width="4" height="102" rx="2" fill="#416a99"/><text x="1160" y="379" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Independent worker pools</text><text x="1160" y="405" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">ETL / model / notification consumers</text><text x="1160" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Pinned version + human authorization</text><text x="1160" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Drain, cancellation and safe retries</text><path d="M720 230 V260 H210 V350" fill="none" stroke="#127c73" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M360 415 H420" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M210 350 V330 H930 V350" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="535" y="323" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#416a99" font-weight="400">Submit durable work</text><path d="M1080 415 H1140" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1089" y="398" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#416a99" font-weight="400">claim</text><path d="M1290 350 V230" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="60" y="650" width="300" height="130" rx="12" fill="#edf3fa" stroke="#416a99" stroke-width="1.6"/><rect x="61" y="664" width="4" height="102" rx="2" fill="#416a99"/><text x="80" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Versioned object storage</text><text x="80" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Original source / document bytes</text><text x="80" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Content hashes + retention policy</text><text x="80" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Encryption and restore procedures</text><rect x="420" y="650" width="300" height="130" rx="12" fill="#edf3fa" stroke="#416a99" stroke-width="1.6"/><rect x="421" y="664" width="4" height="102" rx="2" fill="#416a99"/><text x="440" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Chosen cloud warehouse</text><text x="440" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Transactional merge / reconciliation</text><text x="440" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Before-images if data rollback needed</text><text x="440" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Real-target integration tests</text><rect x="780" y="650" width="300" height="130" rx="12" fill="#edf3fa" stroke="#416a99" stroke-width="1.6"/><rect x="781" y="664" width="4" height="102" rx="2" fill="#416a99"/><text x="800" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Observability + operations</text><text x="800" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Metrics, logs, traces and alerting</text><text x="800" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Restore / failure / load exercises</text><text x="800" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Workload-specific SLOs</text><rect x="1140" y="650" width="300" height="130" rx="12" fill="#fff7ec" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1141" y="664" width="4" height="102" rx="2" fill="#a66824"/><text x="1160" y="679" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Approved external providers</text><text x="1160" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Model endpoint + quotas / budgets</text><text x="1160" y="726" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">SMTP delivery / bounce monitoring</text><text x="1160" y="747" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Controlled data transmission</text><path d="M1290 480 V540 H570 V480" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="750" y="532" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#416a99" font-weight="400">Durable state + recovery ownership</text><path d="M1290 480 V575 H210 V650" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1290 480 V610 H570 V650" fill="none" stroke="#416a99" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="620" y="602" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#416a99" font-weight="400">Idempotent target publication</text><path d="M1290 610 V650" fill="none" stroke="#a66824" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#gold)"/><path d="M210 480 V555 H930 V650" fill="none" stroke="#7e98a2" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="65" y="835" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#416a99" font-weight="600">Release controls: tested migrations → CI tests/scans → immutable image → staging → monitored rollout → rehearsed rollback</text><text x="65" y="867" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Managed containers are a valid first target. Kubernetes and autoscaling follow measured workload and recovery requirements.</text><text x="65" y="897" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">A Dockerfile alone does not establish cloud readiness. Keep the validated recipe boundary and human approval semantics.</text><rect x="60" y="975" width="1380" height="215" rx="15" fill="#fff8ee" stroke="#bd9051" stroke-dasharray="8 5"/><text x="85" y="1008" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a66824" font-weight="700">OPTIONAL LATER — outside the proposed baseline until measurements justify them</text><rect x="85" y="1030" width="390" height="125" rx="12" fill="#fffcf7" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="86" y="1044" width="4" height="97" rx="2" fill="#a66824"/><text x="105" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">pgvector / semantic retrieval</text><text x="105" y="1085" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Only after keyword recall misses are shown</text><text x="105" y="1106" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Evaluate with real relevance judgments</text><text x="105" y="1127" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Do not assume a vector service is needed</text><rect x="510" y="1030" width="390" height="125" rx="12" fill="#fffcf7" stroke="#a66824" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="511" y="1044" width="4" height="97" rx="2" fill="#a66824"/><text x="530" y="1059" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#183039" font-weight="650">Redis cache</text><text x="530" y="1085" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Only for measured repeated cost / latency</text><text x="530" y="1106" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Scope keys + invalidation carefully</text><text x="530" y="1127" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Never the approval/version authority</text><text x="940" y="1057" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a66824" font-weight="650">Agents / rerankers / fine-tuning</text><text x="940" y="1085" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Require demonstrated workflow or quality gaps,</text><text x="940" y="1107" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">curated evaluation data and operational value.</text><text x="940" y="1138" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5d747e" font-weight="400">Not added just to complete a technology list.</text><text x="60" y="1230" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#a66824" font-weight="600">This is a design option, not generated infrastructure or an enabled cloud deployment.</text></svg>